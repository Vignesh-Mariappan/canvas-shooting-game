<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Canvas Game</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="fixed text-white text-sm ml-2 mt-2 select-none">
      <span>Score: </span><span id="score">0</span>
    </div>

    <div class="fixed inset-0 flex items-center justify-center" id="modal">
      <div class="bg-white w-full max-w-md p-6 text-center">
        <h1 class="font-bold text-4xl leading-none" id="modal-score">0</h1>
        <p class="text-sm text-gray-700 mb-4">Points</p>
        <div>
          <button
            id="startGameBtn"
            class="w-full bg-blue-500 py-3 rounded-full text-white cursor-pointer"
          >
            Start Game
          </button>
        </div>
      </div>
    </div>

    <canvas></canvas>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"
      integrity="sha512-NcZdtrT77bJr4STcmsGAESr06BYGE8woZdSdEgqnpyqac7sugNO+Tr4bGwGF3MsnEkGKhU2KL2xh6Ec+BqsaHA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script src="game.js"></script>
  </body>
</html>
